name: Daily Qatar jobs

on:
  schedule:
    - cron: '30 4 * * *'      # every day 07:30 Qatar time (04:30 UTC)
    - cron: '30 11 * * *'     # second try in the afternoon, in case the paper was published late
  workflow_dispatch:           # "Run workflow" button
    inputs:
      seekers_backfill:
        description: 'Only re-send job seekers from every PDF still available (tick once to fill the admin queue)'
        type: boolean
        default: false
  push:
    paths: ['pdfs/**']         # manual fallback: upload a PDF into /pdfs

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the PRIVATE seekers repo
        uses: actions/checkout@v4
        continue-on-error: true            # if this fails, vacancies are still built
        with:
          repository: realtaxinme/taxinme-seekers
          token: ${{ secrets.SEEKERS_REPO_TOKEN }}
          path: seekers-repo
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pdfplumber numpy
      - run: python scripts/fetch_and_build.py
        env:
          SEEKERS_OUT: seekers-repo/seekers.json
          SEEKERS_BACKFILL: ${{ inputs.seekers_backfill && '1' || '' }}
      - name: Commit changes
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
      - name: Save seekers to the private repo
        continue-on-error: true
        run: |
          cd seekers-repo
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add seekers.json
          git diff --staged --quiet || git commit -m "Seekers $(date -u +%F)"
          git push
