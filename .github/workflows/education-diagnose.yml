name: TaxINME education endpoint DIAGNOSTIC (manual only)

# Read-only diagnosis of "HTTP 520" when GitHub posts to taxinme.com.
# - Manual trigger only; it never runs on a schedule.
# - Full TLS verification everywhere (no -k, no --insecure).
# - The Bearer token is read from a secret, passed to curl through a header file
#   (never on the command line, never echoed, never logged with -v).
# - Nothing here publishes vacancies. The optional real-payload test sends the
#   same file the normal workflow sends, so anything it imports lands in the
#   existing Pending Review queue exactly as usual.

on:
  workflow_dispatch:
    inputs:
      origin_ip:
        description: 'InfinityFree origin IP for the direct (Cloudflare-bypassing) test, plain HTTP, no token. Leave blank to skip.'
        required: false
        default: '185.27.134.216'
      send_real_payload:
        description: 'Also POST the real results.json to the PROBE endpoint (imports to Pending Review if the endpoint works).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: taxinme-education-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PRIVATE data repo (only for the optional real-payload test)
        if: ${{ inputs.send_real_payload }}
        uses: actions/checkout@v4
        with:
          repository: realtaxinme/taxinme-seekers
          ref: main
          token: ${{ secrets.SEEKERS_REPO_TOKEN }}
          path: seekers-repo

      - name: Update CA certificates
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates
          sudo update-ca-certificates >/dev/null

      - name: Diagnose GitHub -> Cloudflare -> InfinityFree -> PHP
        env:
          EDU_IMPORT_TOKEN: ${{ secrets.EDU_IMPORT_TOKEN }}
          ORIGIN_IP: ${{ inputs.origin_ip }}
          SEND_REAL: ${{ inputs.send_real_payload }}
        run: |
          set -uo pipefail          # NOTE: no -e on purpose; every test must run and report
          BASE="https://www.taxinme.com"
          CA="/etc/ssl/certs/ca-certificates.crt"
          UA="TaxINME-GitHub-Diagnostic/1.0 (+https://www.taxinme.com/)"
          W="$RUNNER_TEMP/diag"; mkdir -p "$W"

          if [ -z "${EDU_IMPORT_TOKEN:-}" ]; then echo "WARNING: EDU_IMPORT_TOKEN secret is empty; authenticated tests will be skipped."; fi
          # Token goes into a header file so it never appears in a command line or log.
          AUTHFILE="$W/auth.hdr"; umask 077
          printf 'Authorization: Bearer %s\n' "${EDU_IMPORT_TOKEN:-}" > "$AUTHFILE"

          probe() {   # probe <name> <url> [extra curl args...]
            local name="$1" url="$2"; shift 2
            local hdr="$W/$name.headers" body="$W/$name.body" meta
            echo; echo "==================== $name"
            echo "URL: $url"
            : > "$hdr"; : > "$body"
            meta=$(curl --silent --show-error --max-time 60 --connect-timeout 20 \
              --cacert "$CA" --user-agent "$UA" \
              --output "$body" --dump-header "$hdr" \
              --write-out 'status=%{http_code} remote_ip=%{remote_ip} tls_verify_result=%{ssl_verify_result} http=%{http_version} connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes_down=%{size_download}' \
              "$@" "$url" 2>&1)
            echo "$meta"
            local status; status=$(sed -n 's/.*status=\([0-9]*\).*/\1/p' <<<"$meta" | head -1)
            echo "--- response headers (cookie values redacted)"
            if [ -s "$hdr" ]; then
              grep -iE '^(HTTP/|server:|cf-ray:|cf-cache-status:|content-type:|content-length:|location:|retry-after:|set-cookie:|x-[a-z-]+:)' "$hdr" \
                | sed -E 's/^([Ss]et-[Cc]ookie: *[^=]+=)[^;]*/\1<redacted>/' | tr -d '\r'
            else
              echo "(no response headers received - connection failed before any HTTP response)"
            fi
            echo "--- Cloudflare Ray ID"
            { grep -i '^cf-ray:' "$hdr" | tr -d '\r'; grep -oiE 'Ray ID: *<?[^<]*[0-9a-f]{16}' "$body" | head -1; } 2>/dev/null || true
            echo "--- body (first 500 bytes, non-printable replaced)"
            head -c 500 "$body" | tr -c '[:print:]\n' '.'; echo
            echo "--- reading"
            if grep -qiE 'aes\.js|slowAES|__test=|document\.cookie' "$body" 2>/dev/null; then
              echo ">> Body looks like InfinityFree's browser/bot-protection challenge page (hosting is rejecting automated clients)."
            fi
            case "$status" in
              520) echo ">> 520 is generated by CLOUDFLARE: it reached the origin but got an empty, reset or malformed reply.";;
              521) echo ">> 521: Cloudflare says the origin refused the connection.";;
              522|524) echo ">> $status: origin timed out (connect or response).";;
              523) echo ">> 523: Cloudflare cannot reach the origin (DNS/IP/routing).";;
              525|526) echo ">> $status: TLS problem between Cloudflare and origin (check Cloudflare SSL mode / origin certificate).";;
              000|"") echo ">> No HTTP response at all (network or TLS failure; see message above).";;
              2??) echo ">> HTTP $status - origin/PHP answered.";;
              301|302|307|308) echo ">> Redirect (see Location). A redirected POST turns into GET - never follow redirects for the real import.";;
              403|401) echo ">> $status - answered by a rule/auth check (look at server: and body to see WHO answered).";;
              404) echo ">> 404 - file not found on the server (not uploaded yet, or wrong folder).";;
              5??) echo ">> $status - server-side error.";;
            esac
          }

          JSON='Content-Type: application/json'

          probe 01_homepage_GET      "$BASE/"
          probe 02_ping_GET          "$BASE/education/ping.php"
          probe 03_import_GET_notoken "$BASE/education/import_results.php"
          probe 04_import_POST_notoken "$BASE/education/import_results.php" --request POST --header "$JSON" --data '{"diagnostic":true}'

          if [ -n "${EDU_IMPORT_TOKEN:-}" ]; then
            probe 05_ping_POST_bearer "$BASE/education/ping.php" --request POST --header "$JSON" --header @"$AUTHFILE" --data '{"diagnostic":true}'

            python3 -c 'import json; print(json.dumps({"run_id":"diagnostic","results":[],"padding":"x"*200000}))' > "$W/padding.json"
            probe 06_ping_POST_200KB  "$BASE/education/ping.php" --request POST --header "$JSON" --header @"$AUTHFILE" --data-binary @"$W/padding.json"

            EMPTY='{"run_id":"diagnostic","generated_at":"diagnostic","results":[]}'
            probe 07_import_POST_bearer_emptyresults "$BASE/education/import_results.php" --request POST --header "$JSON" --header @"$AUTHFILE" --data "$EMPTY"
            probe 08_PROBE_POST_bearer_emptyresults  "$BASE/education/import_results_probe.php" --request POST --header "$JSON" --header @"$AUTHFILE" --data "$EMPTY"

            if [ "${SEND_REAL:-false}" = "true" ] && [ -f seekers-repo/education/results.json ]; then
              echo; echo "(real payload size: $(wc -c < seekers-repo/education/results.json) bytes)"
              probe 09_PROBE_POST_bearer_REAL_results "$BASE/education/import_results_probe.php" --request POST --header "$JSON" --header @"$AUTHFILE" --data-binary @seekers-repo/education/results.json
            fi
          fi

          if [ -n "${ORIGIN_IP:-}" ]; then
            echo; echo "(Test 10 goes straight to the InfinityFree origin over plain HTTP, WITHOUT any token, to see what the host itself returns without Cloudflare.)"
            probe 10_ORIGIN_DIRECT_ping_GET_http "http://www.taxinme.com/education/ping.php" --resolve "www.taxinme.com:80:${ORIGIN_IP}"
          fi

          echo; echo "==================== DONE. Please copy this whole log (it contains no secrets)."
          rm -f "$AUTHFILE"
