name: TaxINME Teachers & Education jobs

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxinme-education-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out daily-data-sync
        uses: actions/checkout@v4

      - name: Check out private TaxINME seekers repository
        uses: actions/checkout@v4
        with:
          repository: realtaxinme/taxinme-seekers
          ref: main
          token: ${{ secrets.SEEKERS_REPO_TOKEN }}
          path: seekers-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade certifi pdfplumber numpy

      - name: Run education pipeline tests
        run: python scripts/test_education_pipeline.py

      - name: Collect education jobs
        env:
          EDU_SOURCES_FILE: seekers-repo/education/sources.json
          EDU_RESULTS_OUT: seekers-repo/education/results.json
        run: python scripts/fetch_education_jobs.py

      - name: Commit results to private repository
        run: |
          git -C seekers-repo config user.name "github-actions[bot]"
          git -C seekers-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C seekers-repo add education/results.json

          if git -C seekers-repo diff --cached --quiet; then
            echo "No changes to commit."
          else
            git -C seekers-repo commit -m "Update collected education jobs"
            git -C seekers-repo push origin HEAD:main
          fi

      - name: Import vacancies into TaxINME review queue
        env:
          EDU_IMPORT_TOKEN: ${{ secrets.EDU_IMPORT_TOKEN }}
          EDU_IMPORT_URL: https://www.taxinme.com/education/import_results.php
        run: |
          set -euo pipefail
          test -s seekers-repo/education/results.json
          if [ -z "$EDU_IMPORT_TOKEN" ]; then
            echo "Missing GitHub Actions secret: EDU_IMPORT_TOKEN" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${EDU_IMPORT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @seekers-repo/education/results.json \
            "$EDU_IMPORT_URL"
          echo
