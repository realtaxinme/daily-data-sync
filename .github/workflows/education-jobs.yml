name: TaxINME Teachers & Education jobs

on:
  schedule:
    # Twice daily, Qatar time (UTC+3): 08:30 and 15:30.
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxinme-education-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install existing classifier dependencies
        run: python -m pip install pdfplumber numpy

      - name: Run offline classifier and parser checks
        run: python scripts/test_education_pipeline.py

      - name: Collect permitted school vacancies and submit for review
        env:
          TAXINME_EDU_API_URL: ${{ secrets.TAXINME_EDU_API_URL }}
          TAXINME_EDU_API_TOKEN: ${{ secrets.TAXINME_EDU_API_TOKEN }}
        run: python scripts/fetch_education_jobs.py
