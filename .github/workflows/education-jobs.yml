
name: TaxINME Teachers & Education jobs

on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxinme-education-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Check out daily-data-sync
      - name: Check out daily-data-sync
        uses: actions/checkout@v4

      # 2. Check out private TaxINME seekers repository
      - name: Check out private TaxINME seekers repository
        uses: actions/checkout@v4
        with:
          repository: realtaxinme/taxinme-seekers
          ref: main
          token: ${{ secrets.SEEKERS_REPO_TOKEN }}
          path: seekers-repo

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --upgrade certifi pdfplumber numpy

      # 5. Run education pipeline tests
      - name: Run education pipeline tests
        run: |
          set -euo pipefail
          python scripts/test_education_pipeline.py

      # 6. Collect education jobs
      - name: Collect education jobs
        env:
          EDU_SOURCES_FILE: seekers-repo/education/sources.json
          EDU_RESULTS_OUT: seekers-repo/education/results.json
        run: |
          set -euo pipefail
          python scripts/fetch_education_jobs.py

      # 7. Save results to the PRIVATE repository. TaxINME PULLS this file itself
      #    (GitHub never calls taxinme.com: InfinityFree's bot protection blocks that).
      - name: Commit results to private repository
        run: |
          set -euo pipefail

          git -C seekers-repo config user.name "github-actions[bot]"
          git -C seekers-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C seekers-repo add education/results.json

          if git -C seekers-repo diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git -C seekers-repo commit -m "Update collected education jobs"

          # The daily jobs workflow also pushes to this repo: retry after a rebase if we collide.
          for attempt in 1 2 3 4 5; do
            if git -C seekers-repo push origin HEAD:main; then
              echo "Results saved to the private repository (attempt $attempt)."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing and retrying..."
            git -C seekers-repo pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "ERROR: could not push results after 5 attempts."
          exit 1
